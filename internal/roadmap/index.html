<!DOCTYPE html>
<!--
  ===========================================================================
  NOT DRONES - PRODUCT ROADMAP & LOCALIZATION TRACKER  (hidden internal page)
  ---------------------------------------------------------------------------
  Unlinked. Reachable only by typing:  <base-url>/internal/roadmap/
  Excluded from search via <meta robots> + /robots.txt.

  Three views of the same DATA object:
    1. Gantt      - product schedule + subsystem localization lanes
    2. Fishbone   - expandable spec tree per SKU
    3. Slides     - one presentation slide per SKU

  ✦ EDIT EVERYTHING IN ONE PLACE ✦
  All content lives in the DATA / FACTORIES / LANES objects in the <script>
  at the bottom. Specs, dates, factories, notes: change them there and every
  view re-renders. Origin color coding derives from FACTORIES[x].origin.

  Design tokens from /DESIGN.md (Vercel-inspired; see Project adaptations).
  ===========================================================================
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#fafafa" />
  <title>NOT Drones - Roadmap</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" />
  <style>
    :root{
      /* DESIGN.md tokens (Vercel-inspired) */
      --ink:#171717; --body:#4d4d4d; --mute:#888888;
      --hairline:#ebebeb; --hairline-strong:#a1a1a1;
      --canvas:#ffffff; --canvas-soft:#fafafa; --canvas-soft-2:#f5f5f5;
      --link:#0070f3;
      /* Origin semantics (Project adaptations) */
      --imp:#c50000; --imp-soft:#f7d4d6; --imp-bg:#fdf3f3;
      --inh:#1a7f37; --inh-soft:#d6f5df; --inh-bg:#f2fbf5;
      --unk:#ab570a; --unk-soft:#ffefcf;
      --r-sm:6px; --r-md:8px; --r-lg:12px;
      --sans:"Geist",Inter,system-ui,-apple-system,sans-serif;
      --mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
      --shadow:0 1px 1px rgba(0,0,0,.04),0 4px 8px rgba(0,0,0,.04),0 0 0 1px var(--hairline);
      --shadow-hover:0 1px 1px rgba(0,0,0,.05),0 8px 22px rgba(0,0,0,.09),0 0 0 1px var(--hairline-strong);
    }
    *{box-sizing:border-box}
    html{color-scheme:light}
    html,body{margin:0;padding:0}
    body{
      background:var(--canvas-soft);color:var(--ink);font-family:var(--sans);
      -webkit-font-smoothing:antialiased;min-height:100dvh;display:flex;flex-direction:column;
      font-variant-numeric:tabular-nums;
    }
    button{font-family:var(--sans);touch-action:manipulation}
    h1,h2{text-wrap:balance}
    :is(button,a,[role="button"],[tabindex="0"]):focus-visible{
      outline:2px solid var(--link);outline-offset:2px;border-radius:var(--r-sm);
    }

    /* ============ header ============ */
    header{
      display:flex;align-items:center;gap:16px;flex-wrap:wrap;
      padding:14px 24px;background:var(--canvas);border-bottom:1px solid var(--hairline);
      position:sticky;top:0;z-index:40;
    }
    .brand{display:flex;align-items:baseline;gap:10px}
    .brand b{font-weight:600;font-size:15px;letter-spacing:-.3px}
    .brand span{font:500 11px/16px var(--mono);color:var(--mute);text-transform:uppercase;letter-spacing:.14em}
    .tabs{display:flex;gap:2px;background:var(--canvas-soft-2);border:1px solid var(--hairline);border-radius:var(--r-md);padding:3px;margin-left:8px}
    .tabs button{
      border:0;background:transparent;border-radius:var(--r-sm);padding:6px 14px;cursor:pointer;
      font:500 13px/20px var(--sans);color:var(--body);transition:background .15s,color .15s;
    }
    .tabs button:hover{color:var(--ink)}
    .tabs button[aria-selected="true"]{background:var(--canvas);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08),0 0 0 1px var(--hairline)}
    .hspacer{flex:1}
    .legend{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
    .legend .li{display:inline-flex;align-items:center;gap:6px;font:400 12px/16px var(--sans);color:var(--body)}
    .ldot{width:9px;height:9px;border-radius:50%;flex:none}
    .ldot.imp{background:var(--imp)} .ldot.inh{background:var(--inh)} .ldot.unk{background:var(--unk)}
    .conf{font:500 10px/14px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--body);
      border:1px solid var(--hairline-strong);padding:4px 10px;border-radius:var(--r-sm)}

    main{flex:1;display:flex;flex-direction:column;min-height:0}
    .view{display:none;flex:1;min-height:0}
    body[data-view="gantt"] #view-gantt{display:block}
    body[data-view="fishbone"] #view-fishbone{display:flex;flex-direction:column}
    body[data-view="slides"] #view-slides{display:flex;flex-direction:column}

    /* ============ shared chips ============ */
    .fchip{
      display:inline-flex;align-items:center;gap:5px;font:500 11px/14px var(--mono);
      border-radius:var(--r-sm);padding:2px 7px;border:1px solid;white-space:nowrap;
    }
    .fchip.imp{color:var(--imp);background:var(--imp-bg);border-color:var(--imp-soft)}
    .fchip.inh{color:var(--inh);background:var(--inh-bg);border-color:var(--inh-soft)}
    .badge-unk{
      display:inline-flex;font:500 10px/13px var(--mono);letter-spacing:.04em;
      color:var(--unk);background:var(--unk-soft);border-radius:var(--r-sm);padding:2px 6px;
    }
    .badge-na{color:var(--mute);font:400 12px/16px var(--mono)}
    .statuschip{
      display:inline-flex;font:500 10.5px/14px var(--mono);letter-spacing:.06em;text-transform:uppercase;
      color:var(--body);border:1px solid var(--hairline);background:var(--canvas);
      border-radius:var(--r-sm);padding:2px 7px;white-space:nowrap;
    }

    /* ============ GANTT ============ */
    #view-gantt{overflow-y:auto;padding:24px}
    .gwrap{max-width:1280px;margin:0 auto}
    .gtitle{font:600 24px/32px var(--sans);letter-spacing:-.96px;margin:2px 0 4px}
    .gsub{font:400 14px/20px var(--sans);color:var(--body);max-width:65ch;margin:0 0 20px}
    .gscroll{overflow-x:auto;background:var(--canvas);border:1px solid var(--hairline);border-radius:var(--r-lg);box-shadow:0 1px 2px rgba(0,0,0,.03)}
    .gantt{min-width:1060px;position:relative}
    .gmonths{display:flex;border-bottom:1px solid var(--hairline);position:sticky;top:0;background:var(--canvas);z-index:5}
    .gmonths .gname{flex:none}
    .gmonths .gcell{flex:1;font:500 11px/14px var(--mono);color:var(--mute);padding:10px 0 8px 8px;border-left:1px solid var(--hairline)}
    .gname{width:218px;padding:0 14px;flex:none}
    .grow{display:flex;align-items:stretch;border-bottom:1px solid var(--hairline)}
    .grow[data-slide]{cursor:pointer;transition:background .12s}
    .grow[data-slide]:hover{background:var(--canvas-soft)}
    .grow:last-child{border-bottom:0}
    .grow .gname{display:flex;flex-direction:column;justify-content:center;gap:3px;padding-top:9px;padding-bottom:9px}
    .grow .gname .nm{font:500 13px/17px var(--sans);letter-spacing:-.2px;display:flex;align-items:center;gap:7px}
    .grow .gname .meta{display:flex;gap:6px;align-items:center}
    .odot{width:8px;height:8px;border-radius:50%;flex:none}
    .odot.imp{background:var(--imp)} .odot.inh{background:var(--inh)}
    .gtrack{flex:1;position:relative;min-height:52px}
    .ggrid{position:absolute;inset:0;display:flex;pointer-events:none}
    .ggrid i{flex:1;border-left:1px solid var(--hairline)}
    .gbar{
      position:absolute;top:50%;transform:translateY(-50%);height:20px;border-radius:var(--r-sm);
      display:flex;align-items:center;overflow:visible;
    }
    .gbar.imp{background:var(--imp-soft)} .gbar.inh{background:var(--inh-soft)}
    .gbar .fill{position:absolute;inset:0;border-radius:inherit}
    .gbar.imp .fill{border:1px solid color-mix(in srgb,var(--imp) 35%,transparent)}
    .gbar.inh .fill{border:1px solid color-mix(in srgb,var(--inh) 35%,transparent)}
    .gbar.open-start{border-top-left-radius:0;border-bottom-left-radius:0}
    .gbar.open-start .fill{border-left:0;
      -webkit-mask-image:linear-gradient(90deg,transparent,#000 26px);mask-image:linear-gradient(90deg,transparent,#000 26px)}
    .gbar.open-start{-webkit-mask-image:linear-gradient(90deg,transparent,#000 26px);mask-image:linear-gradient(90deg,transparent,#000 26px)}
    .gbar.fade-end{-webkit-mask-image:linear-gradient(90deg,#000 60%,transparent 99%);mask-image:linear-gradient(90deg,#000 60%,transparent 99%)}
    .gbar .blabel{position:relative;font:500 10.5px/14px var(--mono);padding:0 8px;white-space:nowrap}
    .gbar.imp .blabel{color:var(--imp)} .gbar.inh .blabel{color:var(--inh)}
    .gmark{position:absolute;top:50%;width:9px;height:9px;transform:translate(-50%,-50%) rotate(45deg);border-radius:2px;z-index:2}
    .gmark.imp{background:var(--imp)} .gmark.inh{background:var(--inh)} .gmark.ink{background:var(--ink)}
    .gmark-tip{position:absolute;top:calc(50% + 10px);transform:translateX(-50%);font:400 10px/13px var(--mono);color:var(--mute);white-space:nowrap}
    .today{position:absolute;top:0;bottom:0;width:1px;background:var(--link);z-index:4;pointer-events:none}
    .today::after{content:"today";position:absolute;top:2px;left:5px;font:500 9.5px/12px var(--mono);color:var(--link)}
    .gantt .grow ~ .grow .today::after{content:none}
    .gbar.open-start .blabel{padding-left:34px}
    .gmark-tip.up{top:auto;bottom:calc(50% + 10px)}

    .lanes-h{font:600 20px/28px var(--sans);letter-spacing:-.6px;margin:34px 0 4px}
    .lanes-sub{font:400 14px/20px var(--sans);color:var(--body);max-width:65ch;margin:0 0 16px}
    .lane .gname .nm{font-weight:500}
    .lseg{position:absolute;top:50%;transform:translateY(-50%);height:10px;border-radius:999px}
    .lseg.imp{background:var(--imp-soft);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--imp) 30%,transparent)}
    .lseg.inh{background:var(--inh-soft);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--inh) 30%,transparent)}
    .lnote{font:400 11px/15px var(--sans);color:var(--mute)}

    /* ============ FISHBONE ============ */
    #view-fishbone .fbbar{
      display:flex;gap:8px;align-items:center;padding:10px 24px;background:var(--canvas);
      border-bottom:1px solid var(--hairline);flex-wrap:wrap;
    }
    .btn{
      font:500 12.5px/18px var(--sans);color:var(--ink);background:var(--canvas);
      border:1px solid var(--hairline);border-radius:var(--r-sm);padding:6px 12px;cursor:pointer;
      transition:border-color .15s,color .15s;
    }
    .btn:hover{border-color:var(--hairline-strong)}
    .fbhint{font:400 12px/16px var(--sans);color:var(--mute);margin-left:auto}
    .fbviewport{flex:1;overflow:auto;position:relative;cursor:grab;background:var(--canvas-soft);overscroll-behavior:contain}
    .fbviewport.grabbing{cursor:grabbing;user-select:none}
    .fbstage{position:relative}
    .fbstage svg{position:absolute;left:0;top:0;pointer-events:none;z-index:1}
    .fnode{
      position:absolute;z-index:2;background:var(--canvas);border:1px solid var(--hairline);
      border-radius:var(--r-md);padding:8px 11px;box-shadow:var(--shadow);
      width:max-content;max-width:196px;user-select:none;
      transition:transform .35s cubic-bezier(.22,.61,.36,1),opacity .28s ease,box-shadow .15s;
    }
    .fnode.expandable{cursor:pointer}
    .fnode.expandable:hover{box-shadow:var(--shadow-hover)}
    .fnode .fdate{font:500 10.5px/14px var(--mono);color:var(--mute);display:flex;align-items:center;gap:6px;margin-bottom:3px}
    .fnode .flabel{font:500 13px/17px var(--sans);letter-spacing:-.2px}
    .fnode.product .flabel{font-weight:600;font-size:13.5px}
    .fnode .fexp{
      display:inline-flex;align-items:center;gap:4px;margin-top:7px;
      font:500 10.5px/14px var(--mono);color:var(--body);
      background:var(--canvas-soft-2);border:1px solid var(--hairline);border-radius:999px;padding:1px 8px;
    }
    .fnode.open .fexp .sg::before{content:"-"}
    .fnode .fexp .sg::before{content:"+"}
    .fnode .fvalue{font:400 11.5px/15px var(--mono);color:var(--body);margin-top:2px}
    .fnode .fvalue .badge-unk,.fnode .fvalue .badge-na{margin-left:2px}

    /* ============ SLIDES ============ */
    #view-slides{background:var(--canvas-soft-2)}
    .deck{flex:1;display:flex;align-items:center;justify-content:center;padding:22px;min-height:0}
    .slide{
      background:var(--canvas);border:1px solid var(--hairline);border-radius:var(--r-lg);
      box-shadow:0 1px 2px rgba(0,0,0,.04),0 12px 40px rgba(0,0,0,.07);
      width:min(1060px,100%);max-height:100%;overflow-y:auto;padding:40px 48px;
    }
    .slide .s-status{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
    .slide h1{font:600 32px/40px var(--sans);letter-spacing:-1.28px;margin:0 0 6px}
    .slide h2{font:600 20px/28px var(--sans);letter-spacing:-.6px;margin:26px 0 10px}
    .slide .s-dates{font:500 13px/20px var(--mono);color:var(--body);margin:0 0 4px}
    .slide .s-note{font:400 14px/22px var(--sans);color:var(--body);max-width:72ch;margin:10px 0 0}
    .subsys{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;margin-top:18px}
    .subsys .card{border:1px solid var(--hairline);border-radius:var(--r-md);padding:12px 14px;background:var(--canvas)}
    .subsys .card.inh-card{background:var(--inh-bg);border-color:var(--inh-soft)}
    .subsys .card.imp-card{background:var(--imp-bg);border-color:var(--imp-soft)}
    .subsys .chead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
    .subsys .chead b{font:600 13px/18px var(--sans);letter-spacing:-.2px}
    .subsys dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:3px 12px}
    .subsys dt{font:400 11.5px/16px var(--sans);color:var(--mute)}
    .subsys dd{margin:0;font:500 11.5px/16px var(--mono);color:var(--ink);text-align:right}
    .deckbar{
      display:flex;align-items:center;gap:12px;padding:12px 24px;background:var(--canvas);
      border-top:1px solid var(--hairline);justify-content:center;
    }
    .deckbar .count{font:500 12px/16px var(--mono);color:var(--body);min-width:64px;text-align:center}
    .tslide h1{font-size:40px;line-height:46px;letter-spacing:-1.8px}
    .tslide .big-legend{display:flex;gap:22px;margin:22px 0 0;flex-wrap:wrap}
    .tslide .big-legend .li{display:flex;align-items:center;gap:8px;font:400 14px/20px var(--sans);color:var(--body)}
    .story{font:400 15px/24px var(--sans);color:var(--body);max-width:72ch;margin:14px 0 0}
    .sumgrid{display:grid;grid-template-columns:1fr;gap:8px;margin-top:16px}
    .sumrow{display:flex;align-items:center;gap:12px;border:1px solid var(--hairline);border-radius:var(--r-md);padding:10px 14px}
    .sumrow b{font:500 13px/18px var(--sans);width:150px;flex:none}
    .sumrow .st{font:500 12px/16px var(--mono)}
    .sumrow .st.inh{color:var(--inh)} .sumrow .st.imp{color:var(--imp)}
    .sumrow .why{font:400 12px/16px var(--sans);color:var(--mute);margin-left:auto;text-align:right}

    footer{
      display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;
      padding:10px 24px;background:var(--canvas);border-top:1px solid var(--hairline);
      font:400 11.5px/16px var(--sans);color:var(--mute);
    }
    footer .mono{font-family:var(--mono)}

    @media(max-width:720px){
      header{padding:10px 16px;gap:10px}
      .legend{display:none}
      #view-gantt{padding:14px}
      .gname{width:150px;padding:0 10px}
      .slide{padding:24px 20px}
      .slide h1{font-size:24px;line-height:30px;letter-spacing:-.9px}
      .tslide h1{font-size:28px;line-height:34px}
      .fbhint{display:none}
      .subsys dl{grid-template-columns:1fr}
      .subsys dd{text-align:left}
      .sumrow{flex-wrap:wrap}
      .sumrow .why{margin-left:0;text-align:left;width:100%}
    }
    @media (prefers-reduced-motion: reduce){
      *{transition:none !important;animation:none !important}
    }
  </style>
</head>
<body data-view="gantt">

  <header>
    <div class="brand"><b>NOT Drones</b><span>Roadmap</span></div>
    <div class="tabs" role="tablist" aria-label="View">
      <button role="tab" aria-selected="true" data-v="gantt">Gantt</button>
      <button role="tab" aria-selected="false" data-v="fishbone">Fishbone</button>
      <button role="tab" aria-selected="false" data-v="slides">Slides</button>
    </div>
    <div class="hspacer"></div>
    <div class="legend">
      <span class="li"><i class="ldot imp"></i>Imported (CN)</span>
      <span class="li"><i class="ldot inh"></i>In-house (NDIPL)</span>
      <span class="li"><i class="ldot unk"></i>Unknown spec</span>
    </div>
    <span class="conf">Internal</span>
  </header>

  <main>
    <section class="view" id="view-gantt"></section>

    <section class="view" id="view-fishbone">
      <div class="fbbar">
        <button class="btn" id="fb-expand">Expand all</button>
        <button class="btn" id="fb-collapse">Collapse all</button>
        <span class="fbhint">Click a node to expand. Drag to pan.</span>
      </div>
      <div class="fbviewport" id="fbviewport" tabindex="0" aria-label="Roadmap fishbone diagram, scrollable"><div class="fbstage" id="fbstage"><svg id="fbsvg"></svg></div></div>
    </section>

    <section class="view" id="view-slides">
      <div class="deck" id="deck"></div>
      <div class="deckbar">
        <button class="btn" id="s-prev" aria-label="Previous slide">&#8592; Prev</button>
        <span class="count" id="s-count" aria-live="polite"></span>
        <button class="btn" id="s-next" aria-label="Next slide">Next &#8594;</button>
      </div>
    </section>
  </main>

  <footer>
    <span>NOT Drones Innovations Pvt Ltd. Internal planning document, not a public commitment.</span>
    <span class="mono">May 2026 - Apr 2027</span>
  </footer>

      battery:{f:"Paaji", s:{ Configuration:"1S" }},

    },
    {

      markers:[ {d:"2026-10", label:"plastic design final, mould order to MJ", tone:"ink"} ],

  /* Subsystem localization lanes: segments of {from,to,origin}, plus markers */

  /* ============================ ENGINE ============================ */
  const STATUS = { shipping:"Shipping", testing:"Testing", dev:"In development", upcoming:"Upcoming", fading:"Phasing out" };

  const mIdx = s => { const [y,m] = s.split("-").map(Number); return (y-2026)*12 + (m-5); };
  const N_MONTHS = mIdx(TL.last) + 1;
  const dX = s => { if(!s) return null;
    const p = s.split("-"); let x = mIdx(p[0]+"-"+p[1]);
    if(p[2]) x += (Number(p[2])-1)/30; return x; };
  const pct = x => (x / N_MONTHS * 100) + "%";
  const monthName = i => {
    const d = new Date(2026, 4 + i, 1);
    return d.toLocaleString("en", {month:"short"}) + " " + String(d.getFullYear()).slice(2);
  };
  const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

  const originOf = f => FACTORIES[f] ? FACTORIES[f].origin : "cn";
  const coreOrigin = p => (originOf(p.fc.f)==="in" && originOf(p.wifi.f)==="in") ? "inh" : "imp";
  const unknownCount = p => ["fc","wifi","of","battery","frame"]
    .reduce((n,k)=> n + Object.values(p[k].s).filter(v=>v==="Unknown").length, 0);
  const specVal = v =>
    v==="Unknown" ? '<span class="badge-unk">Unknown</span>' :
    v==="NA"      ? '<span class="badge-na">NA</span>' : esc(v);
  const fchip = f => `<span class="fchip ${originOf(f)==="in"?"inh":"imp"}">${esc(f)}</span>`;

  /* ---------------- GANTT ---------------- */
  function ganttMarkers(markers){
    return (markers||[]).map((m,i)=>{
      const x = pct(dX(m.d));
      return `<span class="gmark ${m.tone||"ink"}" style="left:${x}" title="${esc(m.label)}"></span>`+
             `<span class="gmark-tip${i%2?" up":""}" style="left:${x}">${esc(m.label)}</span>`;
    }).join("");
  }
  function ganttBar(p){
    const s = p.start ? dX(p.start) : 0;
    const e = p.end   ? dX(p.end)+ (p.end.length===7 ? 1 : 0) : N_MONTHS;  // month end = start of next
    const cls = [ "gbar", coreOrigin(p),
      !p.start ? "open-start":"", (p.status==="fading") ? "fade-end":"" ].join(" ");
    const label = p.deadlineLabel;
    return `<div class="${cls}" style="left:${pct(s)};width:${pct(e-s).replace("%","")}%">
      <span class="fill"></span><span class="blabel">${esc(label)}</span></div>`;
  }
  function renderGantt(){
    const grid = `<div class="ggrid">${"<i></i>".repeat(N_MONTHS)}</div>`;
    const months = `<div class="gmonths"><div class="gname"></div>${
      Array.from({length:N_MONTHS},(_,i)=>`<div class="gcell">${monthName(i)}</div>`).join("")}</div>`;
    const today = `<span class="today" style="left:${pct(dX(TODAY))}"></span>`;

    const rows = DATA.map(p=>`
      <div class="grow" data-slide="${p.id}" role="button" tabindex="0" title="Open slide: ${esc(p.name)}">
        <div class="gname">
          <span class="nm"><i class="odot ${coreOrigin(p)}"></i>${esc(p.name)}</span>
          <span class="meta"><span class="statuschip">${STATUS[p.status]}</span>${
            unknownCount(p) ? `<span class="badge-unk">${unknownCount(p)} unknown</span>` : ""}</span>
        </div>
        <div class="gtrack">${grid}${today}${ganttBar(p)}${ganttMarkers(p.markers)}</div>
      </div>`).join("");

    const lanes = LANES.map(l=>{
      const segs = l.segs.map(sg=>{
        const a = sg.from ? dX(sg.from) : 0;
        const b = sg.to   ? dX(sg.to)   : N_MONTHS;
        return `<span class="lseg ${sg.o}" style="left:${pct(a)};width:${(b-a)/N_MONTHS*100}%"></span>`;
      }).join("");
      return `<div class="grow lane">
        <div class="gname"><span class="nm">${esc(l.name)}</span>${
          l.note?`<span class="lnote">${esc(l.note)}</span>`:""}</div>
        <div class="gtrack">${grid}${today}${segs}${ganttMarkers(l.markers)}</div>
      </div>`;
    }).join("");

    document.getElementById("view-gantt").innerHTML = `
      <div class="gwrap">
        <h1 class="gtitle">Product schedule</h1>
        <p class="gsub">Every SKU from the spec sheet on one timeline. Red bars run on imported Chinese boards and keep revenue flowing; green bars are built on NDIPL electronics. Click a row for its full spec slide.</p>
        <div class="gscroll"><div class="gantt">${months}${rows}</div></div>
        <h2 class="lanes-h">Subsystem localization</h2>
        <p class="lanes-sub">When each subsystem switches from imported to in-house. The handshake: imported SKUs sell while the green line moves right.</p>
        <div class="gscroll"><div class="gantt">${months}${lanes}</div></div>
      </div>`;

    document.querySelectorAll(".grow[data-slide]").forEach(r=>{
      r.addEventListener("click",()=>{ openSlideFor(r.dataset.slide); });
      r.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); openSlideFor(r.dataset.slide); }});
    });
  }

  /* ---------------- FISHBONE ---------------- */
  const SUBSYS = [ ["fc","Flight controller"], ["wifi","Wifi board"], ["of","Optical flow"], ["battery","Battery"], ["frame","Frame"] ];
  function fbTree(){
    return DATA.map(p=>({
      id:p.id, label:p.name, date:p.deadlineLabel, product:p,
      children: SUBSYS.map(([k,label])=>({
        id:p.id+"."+k, label, factory:p[k].f,
        children: Object.entries(p[k].s).map(([sk,sv])=>({
          id:p.id+"."+k+"."+sk, label:sk, value:sv }))
      }))
    }));
  }
  const FB = { nodes: fbTree(), expanded: new Set(), els: new Map() };
  const LEAF_W = 216, GAPX = 36, LV = 118, HPAD = 70, VPAD = 60;

  function fbLayoutNode(n, side, depth, x0){
    n.side = side; n.depth = depth;
    const kids = (FB.expanded.has(n.id) && n.children) ? n.children : [];
    if(!kids.length){ n.x = x0 + LEAF_W/2; return LEAF_W; }
    let c = x0, first=null, last=null;
    kids.forEach(k=>{ const w = fbLayoutNode(k, side, depth+1, c); c += w; if(first===null) first=k.x; last=k.x; });
    n.x = (first+last)/2;
    return c - x0;
  }
  function fbVisible(n, parent){ return !parent || FB.expanded.has(parent.id); }

  function fbRender(animateFrom){
    const stage = document.getElementById("fbstage");
    const svg = document.getElementById("fbsvg");
    let cursor = 0;
    FB.nodes.forEach((m,i)=>{
      m.sideSign = (i%2===0) ? -1 : 1;
      const w = fbLayoutNode(m, m.sideSign, 1, cursor);
      cursor += Math.max(w, LEAF_W) + GAPX;
    });
    const contentW = Math.max(cursor - GAPX, LEAF_W);
    let topD=1, botD=1;
    const scan = (n)=>{ if(n.sideSign<0 || n.side<0) topD=Math.max(topD,n.depth); else botD=Math.max(botD,n.depth);
      if(FB.expanded.has(n.id) && n.children) n.children.forEach(scan); };
    FB.nodes.forEach(scan);
    const spineY = topD*LV + VPAD + 40;
    const worldW = HPAD*2 + contentW, worldH = spineY + botD*LV + VPAD + 40;
    stage.style.width = worldW+"px"; stage.style.height = worldH+"px";
    svg.setAttribute("width", worldW); svg.setAttribute("height", worldH);

    let paths = [`<line x1="${HPAD-30}" y1="${spineY}" x2="${worldW-HPAD+30}" y2="${spineY}" stroke="var(--hairline-strong)" stroke-width="1.5"/>`];
    const seen = new Set();

    function place(n, parent){
      if(parent && !FB.expanded.has(parent.id)){ if(FB.els.has(n.id)){FB.els.get(n.id).remove(); FB.els.delete(n.id);}
        if(n.children) n.children.forEach(c=>place(c,n)); return; }
      const wx = HPAD + n.x;
      const wy = parent ? (spineY + n.side * n.depth * LV) : (spineY + n.sideSign * LV);
      n.side = parent ? n.side : n.sideSign;
      seen.add(n.id);
      let el = FB.els.get(n.id);
      if(!el){
        el = document.createElement("div");
        el.className = "fnode" + (n.product ? " product":"") + (n.children ? " expandable":"");
        if(n.product){
          const p = n.product;
          el.innerHTML = `<div class="fdate"><i class="odot ${coreOrigin(p)}"></i>${esc(n.date)}</div>
            <div class="flabel">${esc(n.label)}</div>
            <div style="margin-top:5px;display:flex;gap:5px;flex-wrap:wrap">
              <span class="statuschip">${STATUS[p.status]}</span>${
              unknownCount(p)?`<span class="badge-unk">${unknownCount(p)} unknown</span>`:""}</div>
            <span class="fexp"><span class="sg"></span> ${n.children.length}</span>`;
        } else if(n.children){
          el.innerHTML = `<div class="flabel">${esc(n.label)}</div>
            <div style="margin-top:5px">${fchip(n.factory)}</div>
            <span class="fexp"><span class="sg"></span> ${n.children.length}</span>`;
        } else {
          el.innerHTML = `<div class="flabel" style="font-weight:500;font-size:12px">${esc(n.label)}</div>
            <div class="fvalue">${specVal(n.value)}</div>`;
        }
        if(n.children){
          el.setAttribute("role","button"); el.setAttribute("tabindex","0");
          el.setAttribute("aria-expanded", String(FB.expanded.has(n.id)));
          el.addEventListener("click", e=>{ e.stopPropagation(); fbToggle(n); });
          el.addEventListener("keydown", e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); fbToggle(n); }});
        }
        stage.appendChild(el);
        FB.els.set(n.id, el);
        el._tx = wx; el._ty = wy;
        const fx = animateFrom && animateFrom.has(n.id) ? animateFrom.get(n.id) : {x:wx, y:wy};
        el.style.transform = `translate(${fx.x - el.offsetWidth/2}px, ${fx.y - el.offsetHeight/2}px)`;
        el.style.opacity = "0";
        /* read el._tx at frame time: a re-render in the same frame may have
           moved the target, and this callback must not restore stale coords */
        requestAnimationFrame(()=>{ el.style.opacity="1";
          el.style.transform = `translate(${el._tx - el.offsetWidth/2}px, ${el._ty - el.offsetHeight/2}px)`; });
      } else {
        el.classList.toggle("open", FB.expanded.has(n.id));
        if(n.children) el.setAttribute("aria-expanded", String(FB.expanded.has(n.id)));
        el._tx = wx; el._ty = wy;
        el.style.transform = `translate(${wx - el.offsetWidth/2}px, ${wy - el.offsetHeight/2}px)`;
        el.style.opacity = "1";
      }
      n.wx = wx; n.wy = wy;
      if(parent){
        paths.push(`<path d="M ${parent.wx} ${parent.wy} C ${parent.wx} ${(parent.wy+wy)/2}, ${wx} ${(parent.wy+wy)/2}, ${wx} ${wy}" fill="none" stroke="var(--hairline-strong)" stroke-width="1"/>`);
      } else {
        paths.push(`<line x1="${wx}" y1="${spineY}" x2="${wx}" y2="${wy}" stroke="var(--hairline-strong)" stroke-width="1"/>`);
        paths.push(`<circle cx="${wx}" cy="${spineY}" r="3" fill="var(--hairline-strong)"/>`);
      }
      if(n.children) n.children.forEach(c=>{ c.side = n.side; place(c, n); });
    }
    FB.nodes.forEach(m=>place(m, null));
    for(const [id,el] of FB.els){ if(!seen.has(id)){ el.remove(); FB.els.delete(id); } }
    svg.innerHTML = paths.join("");
  }
  function fbToggle(n){
    const from = new Map();
    if(!FB.expanded.has(n.id) && n.children){
      n.children.forEach(c=>from.set(c.id,{x:HPAD+n.x, y:n.wy}));
      FB.expanded.add(n.id);
    } else FB.expanded.delete(n.id);
    fbRender(from);
  }
  function fbAll(open){
    FB.expanded.clear();
    /* expand to subsystem level only; individual specs stay click-to-open,
       a full spec expansion would be ~50k px wide and unreadable */
    if(open) FB.nodes.forEach(n=>FB.expanded.add(n.id));
    fbRender();
  }
  document.getElementById("fb-expand").addEventListener("click", ()=>fbAll(true));
  document.getElementById("fb-collapse").addEventListener("click", ()=>fbAll(false));

  (function pan(){
    const vp = document.getElementById("fbviewport");
    let down=false, sx=0, sy=0, sl=0, st=0;
    vp.addEventListener("pointerdown", e=>{ if(e.target.closest(".fnode")) return;
      down=true; sx=e.clientX; sy=e.clientY; sl=vp.scrollLeft; st=vp.scrollTop;
      vp.classList.add("grabbing"); vp.setPointerCapture(e.pointerId); });
    vp.addEventListener("pointermove", e=>{ if(!down) return;
      vp.scrollLeft = sl-(e.clientX-sx); vp.scrollTop = st-(e.clientY-sy); });
    ["pointerup","pointercancel"].forEach(ev=>vp.addEventListener(ev, ()=>{ down=false; vp.classList.remove("grabbing"); }));
  })();

  /* ---------------- SLIDES ---------------- */
  function productSlide(p){
    const cards = SUBSYS.map(([k,label])=>{
      const o = originOf(p[k].f)==="in" ? "inh" : "imp";
      const rows = Object.entries(p[k].s)
        .map(([sk,sv])=>`<dt>${esc(sk)}</dt><dd>${specVal(sv)}</dd>`).join("");
      return `<div class="card ${o}-card"><div class="chead"><b>${label}</b>${fchip(p[k].f)}</div><dl>${rows}</dl></div>`;
    }).join("");
    return `<div class="slide">
      <div class="s-status"><span class="statuschip">${STATUS[p.status]}</span>${
        unknownCount(p)?`<span class="badge-unk">${unknownCount(p)} unknown specs</span>`:""}
        <span class="fchip ${coreOrigin(p)}">${coreOrigin(p)==="inh"?"in-house core":"imported core"}</span></div>
      <h1>${esc(p.name)}</h1>
      <p class="s-dates">${p.start? esc(fmtDate(p.start))+" &rarr; " : "in market &rarr; "}${p.end? esc(fmtDate(p.end)) : "ongoing"}</p>
      ${p.note?`<p class="s-note">${esc(p.note)}</p>`:""}
      <div class="subsys">${cards}</div>
    </div>`;
  }
  function fmtDate(s){ const p=s.split("-");
    const d=new Date(Number(p[0]), Number(p[1])-1, Number(p[2]||1));
    return (p[2]? d.getDate()+" ":"") + d.toLocaleString("en",{month:"short"}) + " " + d.getFullYear(); }

  function titleSlide(){
    return `<div class="slide tslide">
      <h1>From imported to in-house</h1>
      <p class="story">Twelve SKUs, one plan. Chinese factory builds (LG, Yongyu, LW, BJ, RJ) keep revenue flowing today, while NDIPL electronics come online underneath them: ESP32 flight control ships this month in DIY Nabhyan, LoRa long range lands in December with DIY ORO, and the production-grade STM32 stack proves out in the Army single axis by March 2027. Each slide is one SKU from the spec sheet; amber marks what we still need to find out.</p>
      <div class="big-legend">
        <span class="li"><i class="ldot imp"></i>Imported (Chinese factory)</span>
        <span class="li"><i class="ldot inh"></i>In-house (NDIPL)</span>
        <span class="li"><i class="ldot unk"></i>Unknown, to be confirmed</span>
      </div></div>`;
  }
  function summarySlide(){
    const rows = LANES.map(l=>{
      const finalO = l.segs[l.segs.length-1].o;
      const when = finalO==="inh"
        ? (l.segs.length>1 ? "in-house from " + fmtDate(l.segs[l.segs.length-1].from) : "in-house from day one")
        : "imported, no date yet";
      return `<div class="sumrow"><b>${esc(l.name)}</b>
        <span class="st ${finalO}">${esc(when)}</span>
        ${l.note?`<span class="why">${esc(l.note)}</span>`:""}</div>`;
    }).join("");
    return `<div class="slide"><h1>Localization scorecard</h1>
      <p class="s-note">Where each subsystem stands on the path in-house.</p>
      <div class="sumgrid">${rows}</div></div>`;
  }

  const SLIDES = [ {id:"_title", html:titleSlide()},
    ...DATA.map(p=>({id:p.id, html:productSlide(p)})),
    {id:"_summary", html:summarySlide()} ];
  let slideIdx = 0;
  function showSlide(i){
    slideIdx = Math.max(0, Math.min(SLIDES.length-1, i));
    document.getElementById("deck").innerHTML = SLIDES[slideIdx].html;
    document.getElementById("s-count").textContent = (slideIdx+1) + " / " + SLIDES.length;
    if(document.body.dataset.view==="slides") syncURL();
  }
  function openSlideFor(id){
    const i = SLIDES.findIndex(s=>s.id===id);
    setView("slides"); showSlide(i<0?0:i);
  }
  document.getElementById("s-prev").addEventListener("click", ()=>showSlide(slideIdx-1));
  document.getElementById("s-next").addEventListener("click", ()=>showSlide(slideIdx+1));
  document.addEventListener("keydown", e=>{
    if(document.body.dataset.view!=="slides") return;
    if(e.key==="ArrowRight"||e.key==="PageDown") showSlide(slideIdx+1);
    if(e.key==="ArrowLeft"||e.key==="PageUp") showSlide(slideIdx-1);
  });

  /* ---------------- view switching ---------------- */
  function setView(v){
    document.body.dataset.view = v;
    document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-selected", String(b.dataset.v===v)));
    if(v==="fishbone" && !FB.els.size) fbRender();
    syncURL();
  }
  function syncURL(){
    const u = new URL(location.href);
    u.searchParams.set("view", document.body.dataset.view);
    if(document.body.dataset.view==="slides" && SLIDES[slideIdx].id[0] !== "_")
      u.searchParams.set("sku", SLIDES[slideIdx].id);
    else u.searchParams.delete("sku");
    history.replaceState(null, "", u);
  }
  document.querySelectorAll(".tabs button").forEach(b=>b.addEventListener("click", ()=>setView(b.dataset.v)));

  renderGantt();
  showSlide(0);

  /* deep links: ?view=gantt|fishbone|slides[&sku=<id>][&expand=1] */
  const q = new URLSearchParams(location.search);
  const qv = q.get("view");
  if(qv==="fishbone"){ setView("fishbone"); if(q.get("expand")) fbAll(true); }
  else if(qv==="slides"){ q.get("sku") ? openSlideFor(q.get("sku")) : setView("slides"); }
  </script>
</body>
</html>
